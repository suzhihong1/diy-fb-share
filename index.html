
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美術館驚魂夜｜多語言分享</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: Arial, sans-serif;
  color: #202b3c;
  background: linear-gradient(135deg, #edf4ff, #fff5ef);
}

main {
  width: 100%;
  max-width: 480px;
  padding: 28px;
  background: white;
  border-radius: 22px;
  box-shadow: 0 10px 40px #23344a18;
}

.logo {
  font-size: 14px;
  letter-spacing: 2px;
  color: #647084;
}

h1 { font-size: 26px; line-height: 1.4; }
p { line-height: 1.7; color: #647084; }

.languages {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 22px;
}

button {
  padding: 15px 10px;
  border: 1px solid #dce3ed;
  border-radius: 12px;
  background: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #eef5ff;
  border-color: #1877f2;
}

.note {
  margin-top: 22px;
  padding: 13px;
  border-radius: 10px;
  background: #f5f7fa;
  color: #647084;
  font-size: 13px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

#tag {
  color: #1877f2;
  font-weight: bold;
  margin-bottom: 0;
}

#status {
  margin-top: 12px;
  font-size: 14px;
  overflow-wrap: anywhere;
}

@media (max-width: 350px) {
  .languages { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<main>
  <div class="logo">🎂 DIY EXPERIENCE</div>
  <h1 id="heading">美術館驚魂夜｜選擇語言</h1>
  <p id="intro">選擇你慣用的語言，分享活動！</p>

  <div class="languages">
    <button onclick="share('zh')">🇹🇼 繁體中文</button>
    <button onclick="share('en')">🇺🇸 English</button>
    <button onclick="share('ja')">🇯🇵 日本語</button>
    <button onclick="share('ko')">🇰🇷 한국어</button>
    <button onclick="share('th')">🇹🇭 ภาษาไทย</button>
    <button onclick="share('vi')">🇻🇳 Tiếng Việt</button>
  </div>

  <div class="note">
    <div id="hint">選擇語言後，可使用手機分享選單或開啟 Facebook。</div>
    <p id="tag">#美術館驚魂夜1001上市</p>
    <div id="status" role="status" aria-live="polite"></div>
  </div>
</main>

<script>
const activityUrl =
  "https://www.mydiybc.com/home/menu?id=34248e13-3eac-4886-91cc-35c5a933a57f";

const languages = {
  zh: {
    code: "zh-Hant",
    title: "美術館驚魂夜｜分享活動",
    intro: "一起分享美術館驚魂夜1001上市活動！",
    tag: "#美術館驚魂夜1001上市",
    hint: "分享活動網址，並在 Facebook 貼文中加入下方標籤。"
  },
  en: {
    code: "en",
    title: "Museum Nightmare | Share the Event",
    intro: "Join us in sharing the Museum Nightmare 1001 launch event!",
    tag: "#MuseumNightmare1001",
    hint: "Share the event link and add the hashtag to your Facebook post."
  },
  ja: {
    code: "ja",
    title: "美術館の恐怖の夜｜イベントをシェア",
    intro: "美術館驚魂夜1001の発売イベントをシェアしましょう！",
    tag: "#美術館の恐怖の夜",
    hint: "イベントのリンクをシェアし、ハッシュタグを追加してください。"
  },
  ko: {
    code: "ko",
    title: "미술관의 공포의 밤 | 이벤트 공유",
    intro: "미술관의 공포의 밤 1001 출시 이벤트를 공유해 보세요!",
    tag: "#미술관의공포의밤",
    hint: "이벤트 링크를 공유하고 게시물에 해시태그를 추가해 주세요."
  },
  th: {
    code: "th",
    title: "คืนสยองในพิพิธภัณฑ์ | แชร์กิจกรรม",
    intro: "มาร่วมแชร์กิจกรรมเปิดตัว Museum Nightmare 1001!",
    tag: "#คืนสยองในพิพิธภัณฑ์",
    hint: "แชร์ลิงก์กิจกรรมและเพิ่มแฮชแท็กในโพสต์ Facebook"
  },
  vi: {
    code: "vi",
    title: "Đêm Kinh Hoàng Tại Bảo Tàng | Chia sẻ",
    intro: "Cùng chia sẻ sự kiện ra mắt Museum Nightmare 1001!",
    tag: "#DemKinhHoangTaiBaoTang",
    hint: "Chia sẻ liên kết sự kiện và thêm hashtag vào bài đăng Facebook."
  }
};

function showLanguage(item) {
  document.documentElement.lang = item.code;
  document.getElementById("heading").textContent = item.title;
  document.getElementById("intro").textContent = item.intro;
  document.getElementById("tag").textContent = item.tag;
  document.getElementById("hint").textContent = item.hint;
  document.getElementById("status").textContent = "";
}

async function share(key) {
  const item = languages[key];
  showLanguage(item);

  // 手機優先使用系統分享選單。
  // 分享內容包含活動網址與對應語言標籤。
  if (navigator.share) {
    try {
      await navigator.share({
        title: item.title,
        text: item.tag,
        url: activityUrl
      });
      document.getElementById("status").textContent =
        "已開啟分享功能；請確認分享目的地並自行發布。";
      return;
    } catch (error) {
      // 使用者取消分享時，不要擅自跳轉。
      if (error && error.name === "AbortError") return;
      document.getElementById("status").textContent =
        "無法開啟系統分享選單，請使用下方 Facebook 分享連結。";
    }
  }

  // 不支援系統分享的瀏覽器，使用 Facebook 分享頁。
  const shareUrl = new URL(
    "https://www.facebook.com/sharer/sharer.php"
  );
  shareUrl.searchParams.set("u", activityUrl);
  shareUrl.searchParams.set("hashtag", item.tag);

  window.location.assign(shareUrl.toString());
}
</script>
</body>
</html>
